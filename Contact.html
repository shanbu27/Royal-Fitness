<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="stu.css">
    <title>Contact Us | Royal Fitness</title>
</head>
<body class="cont">

<!-- Identical Header for Consistency -->
<header class="header">
    <div class="logo">
        <img src="log.png" alt="Royal Fitness Logo" class="nav-img">
        Royal <span>Fitness</span>
    </div>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="Service.html">SERVICE</a></li>
            <li><a href="Contact.html" class="active">CONTACT</a></li>
            <li><a href="Price.html">PRICE</a></li>
            <li><a href="Schedule.html">SCHEDULE</a></li>
        </ul>
    </nav>
</header>

<!-- Video Background -->
<div class="video-bg-container">
    <video autoplay muted loop playsinline class="fullscreen-video">
        <source src="kont.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
</div>

<!-- Main Contact Section -->
<main class="contact-container">
    <div class="contact-header">
        <h4>GET IN TOUCH</h4>
        <h1>We Are Here To <span>Help</span></h1>
    </div>

    <div class="contact-content">
        <form action="#" class="contact-form">
            <div class="input-group">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
            </div>
            <input type="tel" placeholder="Your Phone Number">
            <textarea rows="8" placeholder="Write Your Message Here"></textarea>
            <button type="submit" class="send-btn">Send Message</button>
        </form>
    </div>
</main>

<footer class="footer-section">
    <div class="social-icons">
        <a href="#" class="ico"><i class='bx bxl-facebook-circle'></i></a>
        <a href="#" class="ico"><i class='bx bxl-instagram'></i></a>
        <a href="#" class="ico"><i class='bx bxl-twitter' ></i></a>
        <a href="#" class="ico"><i class='bx bxl-github' ></i></a>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2026 Royal Fitness | Gym Street, Wolkite</p>
    </div>
</footer>

</body>
</html>
