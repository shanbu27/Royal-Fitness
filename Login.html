<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="stu.css">
    <title>Login | Royal Fitness</title>
</head>
<body class="login-page">

<!-- Unified Header -->
<header class="header">
    <div class="logo">
        <img src="log.png" alt="Royal Fitness Logo" class="nav-img">
        Royal <span>Fitness</span>
    </div>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="Service.html">SERVICE</a></li>
            <li><a href="Contact.html">CONTACT</a></li>
            <li><a href="Price.html">PRICE</a></li>
            <li><a href="Schedule.html">SCHEDULE</a></li>
        </ul>
    </nav>
</header>

<main class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Welcome <span>Back</span></h2>
            <p>Login to track your progress.</p>
        </div>

        <form class="login-form">
            <div class="input-box">
                <i class='bx bxs-user'></i>
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <!-- IMPORTANT: LINK TO SIGNUP -->
            <div class="register-link">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </form>
    </div>
</main>

<footer class="footer-section">
    <div class="social-icons">
        <a href="#" class="ico"><i class='bx bxl-facebook-circle'></i></a>
        <a href="#" class="ico"><i class='bx bxl-instagram'></i></a>
        <a href="#" class="ico"><i class='bx bxl-twitter' ></i></a>
    </div>
    <p>&copy; 2026 Royal Fitness | Wolkite</p>
</footer>

</body>
</html>
